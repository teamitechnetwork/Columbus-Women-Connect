kind = "web"
previewPath = "/"
title = "Columbus Women Connect"
description = "A welcoming, multi-page website for Columbus Women Connect, a multicultural women's leadership and community network in Columbus, Ohio and a subsidiary of B4P CODEFOUND."
version = "1.0.0"
id = "artifacts/columbus-women-connect"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24320

[services.development]
run = "pnpm --filter @workspace/columbus-women-connect run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/columbus-women-connect", "run", "build" ]
serve = "static"
publicDir = "artifacts/columbus-women-connect/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24320"
BASE_PATH = "/"
